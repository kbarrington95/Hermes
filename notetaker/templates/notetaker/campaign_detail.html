{% extends "core/base.html" %}
{% load static %}

{% block title %}Campaign — Hermes{% endblock %}

{% block styles %}<link rel="stylesheet" href="{% static 'notetaker/styles.css' %}">{% endblock %}

{% block content %}
<div class="page-header">
    <div style="flex:1;">
        <a href="/notetaker/dashboard/" class="back-link">← Campaigns</a>

        <!-- View mode -->
        <div id="campaign-view">
            <h1 class="page-title" id="campaign-name">Loading…</h1>
            <p class="text-muted" id="campaign-desc" style="white-space: pre-wrap;"></p>
        </div>

        <!-- Edit mode -->
        <div id="campaign-edit" style="display:none;">
            <input class="form-control mb-8" id="edit-name" type="text" placeholder="Campaign name">
            <textarea class="form-control summary-textarea" id="edit-desc" placeholder="Description (optional)" rows="2"></textarea>
        </div>
    </div>
    <div style="display:flex; gap:8px; align-items:flex-start; flex-shrink:0;">
        <a class="btn btn-primary" id="upload-btn" href="#">+ Upload Recording</a>
        <a class="btn btn-outline" id="vocab-btn" href="#">Vocabulary</a>
        <button class="btn btn-outline" id="edit-btn" onclick="startEdit()">Edit</button>
        <button class="btn btn-primary" id="save-btn" style="display:none;" onclick="saveEdit()">Save</button>
        <button class="btn btn-outline" id="cancel-btn" style="display:none;" onclick="cancelEdit()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteCampaign()">Delete</button>
    </div>
</div>

<div class="dashboard-col">
    <h2 class="section-title">Sessions</h2>
    <div id="sessions-list">
        <p class="text-muted" id="loading-msg">Loading sessions…</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'core/auth.js' %}"></script>
<script src="{% static 'notetaker/campaign_detail.js' %}"></script>
{% endblock %}
