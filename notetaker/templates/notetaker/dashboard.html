{% extends "core/base.html" %}
{% load static %}

{% block title %}Dashboard — Hermes{% endblock %}

{% block styles %}<link rel="stylesheet" href="{% static 'notetaker/styles.css' %}">{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Campaigns</h1>
    <button class="btn btn-primary" id="new-campaign-btn">+ New Campaign</button>
</div>

<div class="dashboard-col">

    <!-- New campaign form (hidden by default) -->
    <div class="card new-campaign-form" id="new-campaign-form" style="display:none;">
        <h3 class="mt-0">New Campaign</h3>
        <div id="campaign-error" class="alert alert-error" style="display:none;"></div>
        <div class="form-group">
            <label for="campaign-name">Name</label>
            <input type="text" id="campaign-name" class="form-input" placeholder="The Lost Mine of Phandelver">
        </div>
        <div class="form-group">
            <label for="campaign-desc">Description (optional)</label>
            <input type="text" id="campaign-desc" class="form-input" placeholder="A brief description of your campaign">
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" id="create-campaign-btn">Create</button>
            <button class="btn btn-outline" id="cancel-campaign-btn">Cancel</button>
        </div>
    </div>

    <!-- Campaigns list -->
    <div id="campaigns-list">
        <p class="text-muted" id="loading-msg">Loading campaigns…</p>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'core/auth.js' %}"></script>
<script src="{% static 'notetaker/dashboard.js' %}"></script>
{% endblock %}
