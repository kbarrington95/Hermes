{% extends "core/base.html" %}
{% load static %}

{% block title %}Sign Up — Hermes{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card">
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle text-muted">Start transcribing your D&amp;D sessions</p>

        <div id="error-msg" class="alert alert-error" style="display:none;"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="dungeonmaster42" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Create Account</button>
        </form>

        <p class="auth-footer text-muted">
            Already have an account? <a href="/login/">Log in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'core/auth.js' %}"></script>
<script>
    Auth.requireGuest();

    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'Creating account…';
        errorMsg.style.display = 'none';

        try {
            await Auth.register(username, email, password);
        } catch (err) {
            errorMsg.textContent = err.message;
            errorMsg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    });
</script>
{% endblock %}
