{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hermes{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
    {% block styles %}{% endblock %}
</head>

<body>

    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="{% static 'core/logo.svg' %}" alt="Hermes" class="nav-logo" height="200" width="200">
        </a>
        <div class="navbar-links" id="nav-links">
            <a href="/notetaker/dashboard/" class="nav-link">Campaigns</a>
            <a href="/notetaker/subscription/" class="nav-link">Subscription</a>
        </div>
        <div class="navbar-auth" id="nav-auth">
            <!-- Populated by base.js based on JWT in localStorage -->
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'core/base.js' %}"></script>
    {% block scripts %}{% endblock %}

</body>

</html>
